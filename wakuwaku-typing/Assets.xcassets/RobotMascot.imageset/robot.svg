<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" shape-rendering="crispEdges">
  <!-- 12x14 ドット絵ロボット (1ドット = 10単位) -->
  <!-- アンテナ・胸のランプ -->
  <g fill="#ffd60a">
    <rect x="50" y="0" width="20" height="10"/>
    <rect x="50" y="100" width="20" height="10"/>
  </g>
  <!-- ボディ (シルバー) -->
  <g fill="#c9d6e8">
    <rect x="50" y="10" width="20" height="10"/>
    <rect x="20" y="20" width="80" height="10"/>
    <rect x="10" y="30" width="100" height="10"/>
    <rect x="10" y="40" width="10" height="10"/>
    <rect x="100" y="40" width="10" height="10"/>
    <rect x="10" y="50" width="10" height="10"/>
    <rect x="100" y="50" width="10" height="10"/>
    <rect x="10" y="60" width="100" height="10"/>
    <rect x="20" y="70" width="80" height="10"/>
    <rect x="0" y="80" width="20" height="10"/>
    <rect x="30" y="80" width="60" height="10"/>
    <rect x="100" y="80" width="20" height="10"/>
    <rect x="0" y="90" width="20" height="10"/>
    <rect x="30" y="90" width="10" height="10"/>
    <rect x="80" y="90" width="10" height="10"/>
    <rect x="100" y="90" width="20" height="10"/>
    <rect x="0" y="100" width="20" height="10"/>
    <rect x="30" y="100" width="10" height="10"/>
    <rect x="80" y="100" width="10" height="10"/>
    <rect x="100" y="100" width="20" height="10"/>
    <rect x="30" y="110" width="60" height="10"/>
    <rect x="30" y="120" width="20" height="10"/>
    <rect x="70" y="120" width="20" height="10"/>
    <rect x="20" y="130" width="30" height="10"/>
    <rect x="70" y="130" width="30" height="10"/>
  </g>
  <!-- バイザー・胸パネル (ダーク) -->
  <g fill="#101821">
    <rect x="20" y="40" width="10" height="10"/>
    <rect x="50" y="40" width="20" height="10"/>
    <rect x="90" y="40" width="10" height="10"/>
    <rect x="20" y="50" width="80" height="10"/>
    <rect x="40" y="90" width="40" height="10"/>
    <rect x="40" y="100" width="10" height="10"/>
    <rect x="70" y="100" width="10" height="10"/>
  </g>
  <!-- 目 (シアン) -->
  <g fill="#35f0ff">
    <rect x="30" y="40" width="20" height="10"/>
    <rect x="70" y="40" width="20" height="10"/>
  </g>
</svg>
